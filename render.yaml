services:
  - type: web
    name: letsworkout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn serve:app --bind 0.0.0.0:$PORT --timeout 90
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_TIMEZONE
        value: Asia/Seoul
      - key: APP_DATA_DIR
        value: /tmp/letsworkout-data
      - key: REQUIRE_SHEETS_FOR_FINISH
        value: "true"
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        value: 1EZYNSFxd7iuEbKRCNSYyB-rVHz72TkS4TOAJcUxabBA
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
