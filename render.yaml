services:
  - type: web
    name: letsworkout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn serve:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: APP_TIMEZONE
        value: Asia/Seoul
      - key: APP_DATA_DIR
        value: /tmp/letsworkout-data
